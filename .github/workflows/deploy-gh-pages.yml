name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel an in-flight run for the same branch/ref; saves CI minutes on rapid pushes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for the official actions/deploy-pages + Pages API.
# contents: read   — checkout
# pages: write     — deploy to GitHub Pages
# id-token: write  — required by the OIDC-based deploy-pages action
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The productionWeb Angular config already emits <base href="./"> (relative),
      # so the resulting bundle works at the GH Pages subpath /<repo>/ out of the box.
      # No --base-href override needed. See angular.json → productionWeb.
      - name: Build production web bundle
        run: npm run buildFrontend:prodWeb

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
